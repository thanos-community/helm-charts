suite: query file-based endpoint discovery

tests:
  # -- Default ----------------------------------------------------------

  - it: passes no sd-config flag by default
    template: query/deployment.yaml
    set:
      query.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --endpoint.sd-config-file=/etc/thanos/endpoints/endpoints.yml

  - it: renders no endpoints ConfigMap by default
    template: query/configmap-sd.yaml
    set:
      query.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: mounts nothing by default
    template: query/deployment.yaml
    set:
      query.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  # -- Inline config ------------------------------------------------------

  - it: renders the endpoints ConfigMap from the inline config
    template: query/configmap-sd.yaml
    set:
      query.enabled: true
      query.endpoints.sdConfig.config: |
        - targets:
            - thanos-sidecar-0.prometheus:10901
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-thanos-query-endpoints
      - matchRegex:
          path: data["endpoints.yml"]
          pattern: 'thanos-sidecar-0\.prometheus:10901'

  - it: wires the rendered ConfigMap into the Deployment
    template: query/deployment.yaml
    set:
      query.enabled: true
      query.endpoints.sdConfig.config: |
        - targets:
            - thanos-sidecar-0.prometheus:10901
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --endpoint.sd-config-file=/etc/thanos/endpoints/endpoints.yml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: endpoint-sd
            configMap:
              name: RELEASE-NAME-thanos-query-endpoints
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: endpoint-sd
            mountPath: /etc/thanos/endpoints
            readOnly: true

  # -- Existing ConfigMap --------------------------------------------------

  - it: uses an existing ConfigMap and renders none of its own
    template: query/configmap-sd.yaml
    set:
      query.enabled: true
      query.endpoints.sdConfig.existingConfigMap: my-endpoints
      query.endpoints.sdConfig.config: |
        - targets: []
    asserts:
      - hasDocuments:
          count: 0

  - it: mounts the existing ConfigMap under its own key
    template: query/deployment.yaml
    set:
      query.enabled: true
      query.endpoints.sdConfig.existingConfigMap: my-endpoints
      query.endpoints.sdConfig.key: targets.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --endpoint.sd-config-file=/etc/thanos/endpoints/targets.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: endpoint-sd
            configMap:
              name: my-endpoints

  # -- Reload interval and coexistence ------------------------------------

  - it: passes the reload interval when set
    template: query/deployment.yaml
    set:
      query.enabled: true
      query.endpoints.sdConfig.existingConfigMap: my-endpoints
      query.endpoints.sdConfig.reloadInterval: 30s
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --endpoint.sd-config-reload-interval=30s

  - it: keeps autogen and static endpoints alongside file SD
    template: query/deployment.yaml
    set:
      query.enabled: true
      query.endpoints.static:
        - thanos-gateway.cluster2.internal:443
      query.endpoints.sdConfig.existingConfigMap: my-endpoints
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --endpoint=dnssrv+_grpc._tcp.RELEASE-NAME-thanos-storegateway.NAMESPACE.svc.cluster.local
      - contains:
          path: spec.template.spec.containers[0].args
          content: --endpoint=thanos-gateway.cluster2.internal:443
      - contains:
          path: spec.template.spec.containers[0].args
          content: --endpoint.sd-config-file=/etc/thanos/endpoints/endpoints.yml

  - it: keeps extra volumes and mounts working next to file SD
    template: query/deployment.yaml
    set:
      query.enabled: true
      query.endpoints.sdConfig.existingConfigMap: my-endpoints
      query.extraVolumes:
        - name: extra
          emptyDir: {}
      query.extraVolumeMounts:
        - name: extra
          mountPath: /extra
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra
            mountPath: /extra
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: endpoint-sd
            mountPath: /etc/thanos/endpoints
            readOnly: true
