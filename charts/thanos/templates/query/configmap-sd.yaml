{{- $sd := dig "endpoints" "sdConfig" dict .Values.query -}}
{{- /*
No checksum annotation on the Query pods for this ConfigMap: Query re-reads the
file at runtime (`extkingpin.PathContentReloader`), so restarting on a change
would be churn and would defeat the point of file-based discovery.
*/ -}}
{{- if and .Values.query.enabled (dig "config" "" $sd) (not (dig "existingConfigMap" "" $sd)) -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "thanos.compName" (list . "query") }}-endpoints
  namespace: {{ include "thanos.namespace" . }}
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/component: query
  annotations:
    {{- include "thanos.annotations" (dict "Values" .Values "component" "query") | nindent 4 }}
data:
  {{ dig "key" "endpoints.yml" $sd }}: |
    {{- tpl (dig "config" "" $sd) . | nindent 4 }}
{{- end -}}
