{{- if and .Values.receive.enabled .Values.global.networkPolicies }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/component: receive
  name: {{ include "thanos.receive.workloadName" . }}
  namespace: {{ include "thanos.namespace" . }}
spec:
  egress:
    - {}
  ingress:
    - ports:
        - port: grpc
        - port: http
        - port: remote-write
        {{- if eq (include "thanos.receive.isCapnproto" .) "true" }}
        - port: capnproto
        {{- end }}
  podSelector:
    matchLabels:
      {{- include "thanos.selectorLabels" (dict "root" $ "component" "receive") | nindent 6 }}
  policyTypes:
    - Egress
    - Ingress
{{- end }}
