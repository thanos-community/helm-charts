{{- if and .Values.bucketReplicate.enabled (or .Values.bucketReplicate.serviceMonitor.enabled .Values.global.serviceMonitor.enabled) -}}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "thanos.compName" (list . "bucket-replicate") }}
  namespace: {{ include "thanos.namespace" . }}
  labels:
    {{- include "thanos.labels" $ | nindent 4 }}
    app.kubernetes.io/component: bucket-replicate
    {{- if .Values.global.serviceMonitor.labels }}{{ toYaml .Values.global.serviceMonitor.labels | nindent 4 }}{{- end }}
    {{- if .Values.bucketReplicate.serviceMonitor.labels }}{{ toYaml .Values.bucketReplicate.serviceMonitor.labels | nindent 4 }}{{- end }}
  annotations:
    {{- include "thanos.annotations" (dict "Values" .Values "component" "bucketReplicate") | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "thanos.namespace" . }}
  selector:
    matchLabels:
      {{- include "thanos.selectorLabels" (dict "root" $ "component" "bucket-replicate") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ default .Values.global.serviceMonitor.interval .Values.bucketReplicate.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ default .Values.global.serviceMonitor.scrapeTimeout .Values.bucketReplicate.serviceMonitor.scrapeTimeout | quote }}
      {{- with (default .Values.global.serviceMonitor.scheme .Values.bucketReplicate.serviceMonitor.scheme) }}
      scheme: {{ . }}
      {{- end }}
      {{- with (default .Values.global.serviceMonitor.tlsConfig .Values.bucketReplicate.serviceMonitor.tlsConfig) }}
      tlsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.serviceMonitor.basicAuth .Values.bucketReplicate.serviceMonitor.basicAuth) }}
      basicAuth:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.serviceMonitor.metricRelabelings .Values.bucketReplicate.serviceMonitor.metricRelabelings) }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.serviceMonitor.relabelings .Values.bucketReplicate.serviceMonitor.relabelings) }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
