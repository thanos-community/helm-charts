{{- if .Values.bucketReplicate.enabled -}}
{{- $br := .Values.bucketReplicate -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "thanos.compName" (list . "bucket-replicate") }}
  namespace: {{ include "thanos.namespace" . }}
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/component: bucket-replicate
    {{- with $br.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "thanos.annotations" (dict "Values" .Values "component" "bucketReplicate") | nindent 4 }}
    {{- with $br.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ $br.replicaCount }}
  selector:
    matchLabels:
      {{- include "thanos.selectorLabels" (dict "root" $ "component" "bucket-replicate") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "thanos.labels" . | nindent 8 }}
        app.kubernetes.io/component: bucket-replicate
        {{- include "thanos.podLabels" (dict "root" . "key" "bucketReplicate") | nindent 8 }}
      annotations:
        checksum/objstore-configuration: {{ .Values.global.objstore.config | sha256sum }}
        checksum/objstore-to-configuration: {{ $br.objstoreTo.config | sha256sum }}
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "thanos.serviceAccountName" (dict "root" . "component" "bucket-replicate") }}
      {{- include "thanos.affinity" (dict "Values" .Values "component" "bucketReplicate") | nindent 6 }}
      {{- include "thanos.imagePullSecrets" . | nindent 6 }}
      {{- include "thanos.podSC" (dict "root" . "key" "bucketReplicate") | nindent 6 }}
      containers:
        - name: bucket-replicate
          image: {{ include "thanos.image" (dict "root" . "image" .Values.global.image) | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args:
            - tools
            - bucket
            - replicate
            - --http-address=0.0.0.0:{{ $br.service.port }}
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --objstore-to.config-file=/etc/thanos/objstore-to.yml
          {{- range $br.resolutions }}
            - --resolution={{ . }}
          {{- end }}
          {{- range $br.compaction.levels }}
            - --compaction={{ . }}
          {{- end }}
          {{- if not (kindIs "invalid" $br.compaction.min) }}
            - --compaction-min={{ $br.compaction.min }}
          {{- end }}
          {{- if not (kindIs "invalid" $br.compaction.max) }}
            - --compaction-max={{ $br.compaction.max }}
          {{- end }}
          {{- with $br.matcher }}
            - --matcher={{ . }}
          {{- end }}
          {{- with $br.minTime }}
            - --min-time={{ . }}
          {{- end }}
          {{- with $br.maxTime }}
            - --max-time={{ . }}
          {{- end }}
          {{- if $br.ignoreMarkedForDeletion }}
            - --ignore-marked-for-deletion
          {{- end }}
          {{- range $br.extraArgs }}
            - {{ . | quote }}
          {{- end }}
          {{- include "thanos.extraEnvBlock" (dict "Values" .Values "component" "bucketReplicate") | nindent 10 }}
          {{- include "thanos.extraEnvFromBlock" (dict "Values" .Values "component" "bucketReplicate") | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ $br.service.port }}
          volumeMounts:
            - name: objstore
              mountPath: /etc/thanos/objstore.yml
              subPath: objstore.yml
              readOnly: true
            - name: objstore-to
              mountPath: /etc/thanos/objstore-to.yml
              subPath: objstore-to.yml
              readOnly: true
            {{- include "thanos.extraMountItems" (dict "root" . "key" "bucketReplicate") | nindent 12 }}
          {{- include "thanos.containerSC" (dict "root" . "key" "bucketReplicate") | nindent 10 }}
          resources:
            {{- toYaml $br.resources | nindent 12 }}
          {{- include "thanos.httpProbes" (dict "root" . "key" "bucketReplicate") | nindent 10 }}
        {{- include "thanos.extraContainers" (dict "Values" .Values "component" "bucketReplicate" "root" .) | nindent 8 }}
      {{- include "thanos.dnsConfig" (dict "Values" .Values "component" "bucketReplicate") | nindent 6 }}
      {{- include "thanos.initContainers" (dict "Values" .Values "component" "bucketReplicate" "root" .) | nindent 6 }}
      {{- include "thanos.nodeSelector" (dict "Values" .Values "component" "bucketReplicate") | nindent 6 }}
      {{- include "thanos.priorityClassName" (dict "Values" .Values "component" "bucketReplicate") | nindent 6 }}
      {{- include "thanos.tolerations" (dict "Values" .Values "component" "bucketReplicate") | nindent 6 }}
      {{- include "thanos.topologySpreadConstraints" (dict "Values" .Values "component" "bucketReplicate") | nindent 6 }}
      volumes:
        - name: objstore
          secret:
            secretName: {{ .Values.global.objstore.secretName }}
            items:
              - key: {{ .Values.global.objstore.secretKey }}
                path: objstore.yml
        - name: objstore-to
          secret:
            secretName: {{ $br.objstoreTo.secretName }}
            items:
              - key: {{ $br.objstoreTo.secretKey }}
                path: objstore-to.yml
        {{- include "thanos.extraVolumeItems" (dict "root" . "key" "bucketReplicate") | nindent 8 }}
{{- end -}}
