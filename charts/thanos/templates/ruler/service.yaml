{{- if .Values.ruler.enabled }}
apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- include "thanos.annotations" (dict "Values" .Values "component" "ruler") | nindent 4 }}
    {{- with .Values.ruler.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    app.kubernetes.io/component: ruler
    {{- include "thanos.labels" . | nindent 4 }}
    {{- with .Values.ruler.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ include "thanos.compName" (list . "ruler") }}
  namespace: {{ include "thanos.namespace" . }}
spec:
  ports:
    - name: http
      port: {{ .Values.ruler.service.httpPort }}
      targetPort: http
  selector:
    app.kubernetes.io/component: ruler
    app.kubernetes.io/instance: {{ .Release.Name }}
  type: {{ .Values.ruler.service.type }}
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- include "thanos.annotations" (dict "Values" .Values "component" "ruler") | nindent 4 }}
    {{- with .Values.ruler.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    {{- with .Values.ruler.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ include "thanos.compName" (list . "ruler") }}-headless
  namespace: {{ include "thanos.namespace" . }}
spec:
  clusterIP: None
  type: ClusterIP
  ports:
    - name: grpc
      port: {{ .Values.ruler.service.grpcPort }}
      targetPort: grpc
  selector:
    app.kubernetes.io/component: ruler
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
