{{- if and .Values.compactor.enabled (not .Values.compactor.cronJob.enabled) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "thanos.compName" (list . "compactor") }}
  namespace: {{ include "thanos.namespace" . }}
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/component: compactor
    {{- with .Values.compactor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "thanos.annotations" (dict "Values" .Values "component" "compactor") | nindent 4 }}
    {{- with .Values.compactor.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  serviceName: {{ include "thanos.compName" (list . "compactor") }}
  replicas: {{ .Values.compactor.replicaCount }}
  {{- if .Values.compactor.minReadySeconds }}
  minReadySeconds: {{ .Values.compactor.minReadySeconds }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "thanos.selectorLabels" (dict "root" $ "component" "compactor") | nindent 6 }}
  template:
    {{- include "thanos.compactor.podTemplate" (dict "root" . "cron" false) | nindent 4 }}
  {{- if and .Values.compactor.persistence.enabled (not .Values.compactor.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "thanos.labels" $ | nindent 10 }}
          app.kubernetes.io/component: compactor
      spec:
        accessModes:
        {{- range .Values.compactor.persistence.accessModes | default (list "ReadWriteOnce") }}
          - {{ . | quote }}
        {{- end }}
        {{- include "thanos.storageClass" (dict "root" . "key" "compactor" "persistence" .Values.compactor.persistence) | indent 8 }}
        resources:
          requests:
            storage: {{ .Values.compactor.persistence.size }}
  {{- end }}
{{- end }}
